<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CosmoDash · Respostas do Cosmo</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
<link rel="stylesheet" href="./CosmoDash.css">
</head>
<body>
<template data-dc><x-dc>
<div class="app {{shell}}">
<sc-include name="sidebar"></sc-include>

<main class="main">
  <header class="top" style="justify-content:space-between">
    <div><div class="hud">Assistente · {{org.name}}</div><h1 class="h1">Respostas do Cosmo</h1></div>
    <a class="btn sm pri" href="Main.dc.html#cosmo-q">Perguntar ao Cosmo</a>
  </header>

  <div class="split">
    <section style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <sc-for list="{{groups}}" as="g">
        <div class="glass card-pad" style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 class="h2">{{g.name}}</h2><span class="chip">{{g.count}}</span></div>
          <sc-for list="{{g.items}}" as="i">
            <div class="well" style="padding:12px 14px;display:flex;flex-direction:column;gap:6px">
              <div class="small" style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600">{{i.q}}</span><span class="caption t2" style="white-space:nowrap">{{i.when}}</span></div>
              <p class="small t2" style="margin:0;line-height:1.47;text-wrap:pretty">{{i.text}}</p>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <sc-if value="{{empty}}"><div class="glass card-pad small t2" style="text-align:center;padding:40px">Nenhuma pergunta ainda. Pergunte ao Cosmo pela caixa do Painel e as respostas aparecem aqui, separadas por assunto.</div></sc-if>
      <sc-if value="{{hasLog}}"><button class="btn sm ghost" style="align-self:flex-start" onClick="{{clearLog}}">Limpar histórico</button></sc-if>
    </section>

    <aside class="glass card-pad" style="display:flex;flex-direction:column;gap:14px;align-self:start">
      <div style="display:flex;align-items:center;gap:12px"><span class="orb" aria-hidden="true"></span><div><h2 class="h2">Conectar sua IA</h2><div class="caption t2">{{status}}</div></div></div>
      <p class="small t2" style="margin:0;line-height:1.47">Use a sua conta de Claude, ChatGPT, Gemini ou Grok para o Cosmo responder. A conexão é feita com uma chave de API da sua conta, cobrada por uso pelo provedor. A assinatura pessoal (Pro, Plus) não serve para isso.</p>
      <div><label class="lb" for="ai-p">Provedor</label><select id="ai-p" class="inp" value="{{f.provider}}" onChange="{{on.provider}}"><sc-for list="{{providers}}" as="p"><option value="{{p.id}}">{{p.n}}</option></sc-for></select></div>
      <div><label class="lb" for="ai-k">Chave de API</label><input id="ai-k" class="inp" type="password" autocomplete="off" value="{{f.key}}" onChange="{{on.key}}" placeholder="{{keyHint}}"></div>
      <div><label class="lb" for="ai-m">Modelo</label><input id="ai-m" class="inp" value="{{f.model}}" onChange="{{on.model}}" placeholder="{{modelHint}}"></div>
      <a class="small" href="{{keyUrl}}" target="_blank" rel="noopener">Onde pego a chave de {{providerName}} ›</a>
      <sc-if value="{{hasMsg}}"><div class="small" role="status" style="color:{{msgColor}}">{{msg}}</div></sc-if>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm pri" onClick="{{save}}">Salvar e testar</button>
        <sc-if value="{{connected}}"><button class="btn sm" onClick="{{disconnect}}">Desconectar</button></sc-if>
      </div>
      <div class="caption t2" style="line-height:1.5">A chave fica salva só neste navegador e vai direto para o provedor, junto com um resumo dos dados da organização para o Cosmo responder. Não use em computador compartilhado.</div>
    </aside>
  </div>
</main>
<sc-include name="toast"></sc-include>
</div>
</x-dc></template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  state = { orgOpen: false, toast: null, f: null, msg: '', ok: true };
  renderVals() {
    const s = this.state;
    const a = Orb.ai();
    const f = s.f || { provider: a ? a.provider : 'anthropic', key: '', model: a ? a.model : '' };
    const P = Orb.AI[f.provider];
    const log = Orb.cosmoLog();
    const groups = Object.keys(Orb.TOPICS).map((id) => {
      const items = log.filter((x) => (x.topic || 'outros') === id);
      return { name: Orb.TOPICS[id], count: items.length, items: items.slice(0, 8).map((x) => ({ q: x.q, text: x.text, when: Orb.ago(x.ts) })) };
    }).filter((g) => g.count);
    const set = (k) => (e) => this.setState({ f: Object.assign({}, f, { [k]: e.target.value }), msg: '' });
    return Object.assign(Orb.shell(this, 'Cosmo.dc.html'), {
      groups, empty: !log.length, hasLog: !!log.length,
      clearLog: () => { log.length = 0; Orb.save(); this.setState({}); },
      providers: Object.keys(Orb.AI).map((id) => ({ id, n: Orb.AI[id].n })),
      f, on: { provider: (e) => this.setState({ f: Object.assign({}, f, { provider: e.target.value, model: '' }), msg: '' }), key: set('key'), model: set('model') },
      keyHint: a && a.provider === f.provider ? 'Chave salva. Cole outra para trocar' : 'Cole a chave aqui',
      modelHint: P.model, keyUrl: P.keyUrl, providerName: P.n.split(' ')[0],
      status: a ? 'Conectado: ' + Orb.AI[a.provider].n + ' · ' + a.model : 'Sem IA conectada. O Cosmo responde por regras.',
      connected: !!a, hasMsg: !!s.msg, msg: s.msg, msgColor: s.ok ? 'var(--teal)' : '#ef4444',
      disconnect: () => { Orb.clearAI(); this.setState({ f: null, msg: 'IA desconectada.', ok: true }); },
      save: async () => {
        const key = f.key || (a && a.provider === f.provider ? a.key : '');
        const prev = a;
        const err = Orb.setAI(f.provider, key, f.model);
        if (err) return this.setState({ msg: err, ok: false });
        this.setState({ msg: 'Testando a conexão…', ok: true });
        try {
          const reply = await Orb.askAI([{ role: 'user', text: 'Apresente-se em uma frase.' }]);
          this.setState({ f: null, msg: 'Conectado. ' + reply.trim(), ok: true });
        } catch (e) {
          if (prev) { Orb.setAI(prev.provider, prev.key, prev.model); } else Orb.clearAI();
          this.setState({ msg: 'A conexão falhou: ' + e.message, ok: false });
        }
      }
    });
  }
}
</script>
</body>
</html>
