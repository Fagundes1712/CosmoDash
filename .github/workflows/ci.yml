name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome deste job é a verificação obrigatória em .github/branch-protection.json.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Testar o site gerado
        run: |
          python3 -m http.server 4173 --directory dist &
          sleep 1
          SMOKE_ATTEMPTS=3 SMOKE_WAIT_MS=2000 npm run smoke -- http://localhost:4173/
      - name: Guardar o site para pré-visualização
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7
