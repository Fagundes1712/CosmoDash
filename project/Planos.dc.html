<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CosmoDash · Planos &amp; pagamentos</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
<link rel="stylesheet" href="./CosmoDash.css">
</head>
<body>
<template data-dc><x-dc>
<div class="app {{shell}}">
<sc-include name="sidebar"></sc-include>

<main class="main">
  <header class="top" style="justify-content:space-between">
    <div><div class="hud">Administração · Assinatura de {{org.name}}</div><h1 class="h1">Planos &amp; pagamentos</h1></div>
    <div class="seg" role="group" aria-label="Ciclo de cobrança"><button class="{{cM}}" onClick="{{setM}}">Mensal</button><button class="{{cA}}" onClick="{{setA}}">Anual · −20%</button></div>
  </header>

  <sc-if value="{{readOnly}}"><div style="padding:12px 14px;border-radius:12px;background:var(--fill-q);border:1px solid var(--orange);font-size:13px">Seu papel nesta organização é {{org.role}}: você pode consultar a assinatura, mas só quem tem a permissão Plano e cobrança faz alterações.</div></sc-if>

  <section class="grid-a" style="grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))">
    <div class="glass scan" style="padding:22px;display:flex;flex-direction:column;gap:12px;border-color:var(--accent)">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="hud">Plano atual</span><span class="chip gr">Ativo</span></div>
      <div style="display:flex;align-items:baseline;gap:10px"><span class="disp" style="font-size:34px;font-weight:600">{{curName}}</span><span style="color:var(--label-2)">{{curSeats}}</span></div>
      <div style="font-size:13px;color:var(--label-2)">Próxima cobrança <b>{{nextDate}}</b> · <span class="disp" style="font-weight:600;color:var(--label)">{{curTotal}}</span></div>
      <div style="font-size:12px;color:var(--label-2)">{{cycleNote}}</div>
    </div>
    <div class="glass" style="padding:22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="hud">Forma de pagamento</span><sc-if value="{{canChangeCard}}"><button class="btn sm" onClick="{{changeCard}}">Alterar</button></sc-if></div>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:64px;height:42px;border-radius:9px;background:var(--fill-q);border:1px solid var(--separator);position:relative"><span style="position:absolute;left:8px;top:9px;width:14px;height:10px;border-radius:2px;background:var(--orange)"></span></div>
        <div><div style="font-weight:600">{{pay.l}}</div><div style="font-size:12px;color:var(--label-2)">{{pay.s}}</div></div>
      </div>
      <div class="seg" role="group" aria-label="Método" style="align-self:flex-start"><button class="{{pC}}" onClick="{{payC}}">Cartão</button><button class="{{pP}}" onClick="{{payP}}">Pix automático</button><button class="{{pB}}" onClick="{{payB}}">Boleto</button></div>
    </div>
    <div class="glass" id="uso" style="padding:22px;display:flex;flex-direction:column;gap:12px">
      <span class="hud">Uso do ciclo</span>
      <sc-for list="{{usage}}" as="u">
        <div style="display:flex;flex-direction:column;gap:5px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>{{u.n}}</span><span style="color:var(--label-2)">{{u.v}}</span></div><div class="{{u.cls}}"><i style="width:{{u.w}}"></i></div></div>
      </sc-for>
    </div>
  </section>

  <section class="glass" style="padding:24px" aria-labelledby="plan-title">
    <h2 class="h2" id="plan-title">Mudar de plano</h2>
    <div class="plan-grid">
      <div>
        <h3 class="lb" style="margin:18px 0 12px">Tipo de plano<span style="color:#ef4444">*</span></h3>
        <div role="radiogroup" aria-labelledby="plan-title" style="display:flex;flex-direction:column;gap:14px">
          <sc-for list="{{plans}}" as="p">
            <button type="button" role="radio" aria-checked="{{p.on}}" class="{{p.cls}}" onClick="{{p.choose}}">
              <span class="plan-body">
                <span class="radio" aria-hidden="true"><i></i></span>
                <span style="display:block;width:100%">
                  <span style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;line-height:1.5"><b style="font-weight:600">{{p.n}}</b><sc-if value="{{p.rec}}"><span class="badge">recomendado</span></sc-if><sc-if value="{{p.isCur}}"><span class="badge pos">plano atual</span></sc-if></span>
                  <span class="caption t2" style="display:block">{{p.d}}</span>
                  <span class="feat"><sc-for list="{{p.f}}" as="x"><span class="li"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--label-3)"><path d="M5 12l5 5L20 7"></path></svg>{{x}}</span></sc-for></span>
                </span>
              </span>
              <span class="plan-foot"><span class="caption t2" style="display:flex;align-items:center;gap:6px"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg>{{p.seats}}</span><span style="white-space:nowrap"><b class="disp" style="font-size:1.125rem;font-weight:600">{{p.price}}</b><span class="small t2">/usuário/mês</span></span></span>
            </button>
          </sc-for>
        </div>
      </div>
      <aside class="muted-panel" style="align-self:start">
        <h3 style="margin:0;font-size:.9375rem;font-weight:600">Qual plano combina com a sua equipe?</h3>
        <p class="small t2" style="margin:8px 0 0;line-height:1.55">Compare pelo tamanho da equipe e pelo uso do ciclo atual. O Pro atende até 10 usuários; acima disso, só o Business não tem limite de usuários nem de contatos.</p>
        <ul class="hilite">
          <sc-for list="{{highlights}}" as="h"><li><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex:0 0 20px"><circle cx="12" cy="12" r="10" fill="var(--accent)"></circle><path d="M7.5 12.5l3 3 6-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>{{h}}</span></li></sc-for>
        </ul>
        <a href="#uso" class="small" style="display:inline-flex;align-items:center;gap:4px;margin-top:12px">Ver o uso do ciclo atual<svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
      </aside>
    </div>
    <hr class="divider">
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap">
      <sc-if value="{{readOnly}}"><span class="caption t2" style="margin-right:auto">Só administradores podem mudar o plano.</span></sc-if>
      <button type="button" class="btn ghost" onClick="{{resetSel}}">Cancelar</button>
      <button type="button" class="btn pri" aria-disabled="{{sameSel}}" onClick="{{applySel}}">Atualizar plano</button>
    </div>
  </section>

  <section class="glass" style="padding:8px 6px">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px;gap:8px;flex-wrap:wrap"><h2 class="h2">Faturas</h2><span style="font-size:12px;color:var(--label-2)">NFS-e emitida para o CNPJ cadastrado quando a cobrança real for integrada</span></div>
    <div class="tblw"><table class="tbl">
      <thead><tr><th>Competência</th><th>Descrição</th><th>Valor</th><th>Status</th><th>Pago em</th><th></th></tr></thead>
      <tbody>
        <sc-for list="{{invoices}}" as="i">
          <tr><td style="font-weight:600">{{i.m}}</td><td style="color:var(--label-2)">{{i.d}}</td><td class="disp" style="font-weight:600">{{i.v}}</td><td><span class="chip gr">Paga</span></td><td style="color:var(--label-2)">{{i.p}}</td><td style="text-align:right"><button class="btn sm ghost" onClick="{{i.dl}}">Baixar</button></td></tr>
        </sc-for>
      </tbody>
    </table></div>
    <sc-if value="{{noInv}}"><div style="padding:32px;text-align:center;color:var(--label-2)">Nenhuma fatura ainda.</div></sc-if>
  </section>
</main>

<sc-if value="{{hasModal}}">
  <div class="ov">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="up-t">
      <div class="hud" style="color:var(--accent-text)">Confirmar mudança</div>
      <h2 id="up-t" class="disp" style="margin:6px 0 16px;font-size:24px">{{m.from}} → {{m.to}}</h2>
      <div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;padding:16px;border-radius:14px;background:var(--page);border:1px solid var(--separator)">
        <div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--label-2)">{{m.totalLabel}}</span><b class="disp">{{m.total}}</b></div>
        <sc-if value="{{m.hasPro}}"><div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--label-2)">{{m.proLabel}}</span><b class="disp">{{m.pro}}</b></div></sc-if>
        <div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--label-2)">Cobrado em</span><b>{{pay.l}}</b></div>
      </div>
      <p style="font-size:12.5px;color:var(--label-2);line-height:1.5;margin:14px 0 14px">{{m.note}}</p>
      <sc-if value="{{m.blocked}}">
        <div class="err" role="alert" style="margin-bottom:14px"><b>Antes de mudar:</b><sc-for list="{{m.blockers}}" as="b"><div>{{b}}</div></sc-for><a href="Equipe.dc.html" style="font-weight:600">Abrir equipe →</a></div>
      </sc-if>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" data-close onClick="{{closeModal}}">Cancelar</button><button class="btn pri" onClick="{{confirm}}" disabled="{{m.blocked}}">Confirmar {{m.to}}</button></div>
    </div>
  </div>
</sc-if>
<sc-include name="toast"></sc-include>
</div>
</x-dc></template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  state = { orgOpen: false, toast: null, pending: null, pendingCycle: null, sel: null };
  renderVals() {
    const s = this.state;
    const O = Orb.data(), SP = Orb.SEED.plans;
    const can = Orb.can('bill');
    const cur = SP[O.plan];
    const k = O.cycle === 'a' ? 0.8 : 1;
    const total = Orb.monthly();
    const guard = (fn) => () => { if (!can) return Orb.flash(this, 'Seu papel não permite alterar a assinatura'); fn(); };
    const sel = SP[s.sel] ? s.sel : O.plan;
    // Seletor de plano (grupo de opções): escolher só marca a opção; a troca passa pela confirmação.
    const plans = Object.keys(SP).map((id) => { const p = SP[id]; return { n: p.n, d: p.d, f: p.f, seats: p.seats, price: 'R$ ' + Math.round(p.p * k), isCur: id === O.plan, rec: id === 'business' && O.plan !== 'business', on: id === sel ? 'true' : 'false', cls: id === sel ? 'plan-opt glass on' : 'plan-opt glass', choose: () => this.setState({ sel: id }) }; });
    const highlights = ['Cosmo, tarefas e gamificação em todos os planos', 'Desconto de 20% no ciclo anual', 'Ao trocar, a diferença é proporcional aos dias restantes'];
    let m = {};
    if (s.pending) {
      const np = SP[s.pending]; const nt = Orb.monthly(s.pending); const diff = nt - total; const up = np.rank > cur.rank;
      const blockers = Orb.planBlockers(s.pending);
      const days = Orb.daysToCharge();
      m = { from: cur.n, to: np.n, totalLabel: 'Novo valor mensal (' + Orb.seatsBilled(s.pending) + ' usuários)', total: Orb.brl2(nt), hasPro: diff !== 0, proLabel: diff > 0 ? 'Diferença proporcional, ' + days + ' dias' : 'Crédito na próxima fatura', pro: Orb.brl2(Math.abs(diff) * days / 30), blocked: blockers.length > 0, blockers,
        note: up ? 'O upgrade vale na hora, para toda a organização.' : 'A redução vale no próximo ciclo. Recursos exclusivos ficam somente leitura.' };
    } else if (s.pendingCycle) {
      const nt = Orb.monthly(O.plan, s.pendingCycle);
      m = { from: O.cycle === 'a' ? 'Anual' : 'Mensal', to: s.pendingCycle === 'a' ? 'Anual' : 'Mensal', totalLabel: s.pendingCycle === 'a' ? 'Cobrança anual' : 'Cobrança mensal', total: Orb.brl2(s.pendingCycle === 'a' ? nt * 12 : nt), hasPro: false, blocked: false, blockers: [], note: s.pendingCycle === 'a' ? 'Economia de ' + Orb.brl2(Orb.monthly(O.plan, 'm') * 12 * 0.2) + ' por ano. A mudança vale a partir da próxima cobrança.' : 'Você perde o desconto de 20%. A mudança vale a partir da próxima cobrança.' };
    }
    const PAY = { c: { l: O.cardLabel, s: 'Cartão de crédito' }, p: { l: 'Pix automático', s: 'Débito autorizado no banco da empresa' }, b: { l: 'Boleto bancário', s: 'Enviado 5 dias antes do vencimento' } };
    const lim = cur.limits;
    const U = [['Assentos', Orb.seatsUsed(), lim.seats, ''], ['Contatos', Orb.contactsCount(), lim.contacts, ''], ['Consultas ao Cosmo', O.usage.cosmo, lim.cosmo, ''], ['Armazenamento', O.usage.storage, lim.storage, ' GB']];
    const usage = U.map((u) => ({ n: u[0], v: u[2] !== null ? Orb.num(u[1]) + u[3] + ' de ' + Orb.num(u[2]) + u[3] : Orb.num(u[1]) + u[3] + ' · ilimitado', w: u[2] !== null ? Math.min(100, Math.round(u[1] / u[2] * 100)) + '%' : '8%', cls: u[2] !== null && u[1] / u[2] >= 0.85 ? 'bar or' : 'bar' }));
    const download = (i) => {
      const text = 'Fatura ' + i[0] + '\nOrganização: ' + O.name + '\nDescrição: ' + i[1] + '\nValor: ' + Orb.brl2(i[2]) + '\nPaga em: ' + i[3] + '\n\nDocumento de demonstração, sem valor fiscal.\n';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = 'fatura-' + i[0].toLowerCase().replace(/\s+/g, '-') + '.txt'; a.click(); URL.revokeObjectURL(a.href);
    };
    const invoices = O.invoices.map((i) => ({ m: i[0], d: i[1], v: Orb.brl2(i[2]), p: i[3], dl: () => { download(i); Orb.flash(this, 'Fatura de ' + i[0] + ' baixada'); } }));
    const pm = (x) => guard(() => { O.pay = x; Orb.audit('Forma de pagamento: ' + PAY[x].l); Orb.save(); Orb.flash(this, 'Forma de pagamento: ' + PAY[x].l); });
    const askCycle = (c) => guard(() => { if (O.cycle !== c) this.setState({ pendingCycle: c }); });
    const next = Orb.nextCharge();
    return Object.assign(Orb.shell(this, 'Planos.dc.html'), {
      readOnly: !can, cM: O.cycle === 'm' ? 'on' : '', cA: O.cycle === 'a' ? 'on' : '', setM: askCycle('m'), setA: askCycle('a'),
      curName: cur.n, curSeats: cur.seats, nextDate: next.toLocaleDateString('pt-BR'), curTotal: Orb.brl2(total) + (O.cycle === 'a' ? '/mês' : ''),
      cycleNote: O.cycle === 'a' ? 'Cobrança anual de ' + Orb.brl2(total * 12) + ' · economia de ' + Orb.brl2(Orb.monthly(O.plan, 'm') * 12 * 0.2) + ' por ano' : 'No anual você economiza ' + Orb.brl2(total * 12 * 0.2) + ' por ano',
      pay: PAY[O.pay], pC: O.pay === 'c' ? 'on' : '', pP: O.pay === 'p' ? 'on' : '', pB: O.pay === 'b' ? 'on' : '', payC: pm('c'), payP: pm('p'), payB: pm('b'), canChangeCard: can && O.pay === 'c',
      changeCard: () => Orb.flash(this, 'A troca de cartão entra com o gateway de pagamento'),
      usage, plans, highlights, sameSel: sel === O.plan ? 'true' : 'false', resetSel: () => this.setState({ sel: null }),
      applySel: guard(() => { if (sel === O.plan) return Orb.flash(this, 'Escolha um plano diferente do atual'); this.setState({ pending: sel }); }),
      invoices, noInv: invoices.length === 0, hasModal: !!s.pending || !!s.pendingCycle, m, closeModal: () => this.setState({ pending: null, pendingCycle: null }),
      confirm: () => {
        if (s.pendingCycle) { O.cycle = s.pendingCycle; Orb.audit('Ciclo de cobrança: ' + m.to); Orb.save(); this.setState({ pendingCycle: null }); return Orb.flash(this, 'Ciclo alterado para ' + m.to); }
        const r = Orb.changePlan(s.pending);
        if (!r.ok) return;
        const n = SP[s.pending].n;
        this.setState({ pending: null, sel: null });
        Orb.flash(this, 'Plano alterado para ' + n);
      }
    });
  }
}
</script>
</body>
</html>
