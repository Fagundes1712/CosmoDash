name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome deste job é a verificação obrigatória em .github/branch-protection.json.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Testar o site gerado
        run: |
          python3 -m http.server 4173 --directory dist &
          sleep 1
          SMOKE_ATTEMPTS=3 SMOKE_WAIT_MS=2000 npm run smoke -- http://localhost:4173/
      - name: Guardar o site para pré-visualização
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          retention-days: 7
